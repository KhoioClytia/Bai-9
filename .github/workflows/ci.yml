name: Java CI/CD Maven Workflow

# 1. Kích hoạt workflow khi có sự kiện push hoặc pull_request
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
      strategy:
        matrix:
          os: [ ubuntu-latest, windows-latest, macos-latest ]
      runs-on: ${{ matrix.os }}

      steps:

       - name: Checkout repository code
         uses: actions/checkout@v4

       - name: Set up JDK 17
         uses: actions/setup-java@v4
         with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

       - name: Run Unit Tests
         working-directory: ./Bai 9.2
         run: mvn test

       - name: Package Application
         working-directory: ./Bai 9.2
         run: mvn package

       - name: Upload JAR Artifact
         uses: actions/upload-artifact@v4
         with:
           name: math-utils-app-jar
           path: Bai 9.2/target/*.jar
           retention-days: 7
             # Thực thi vòng đời verify (gồm compile, test, jacoco report & jacoco check)
                             - name: Run Maven Verify & JaCoCo Coverage Check
                             working-directory: ./Bai 9.2   # Điều chỉnh đúng thư mục chứa pom.xml
                             run: mvn clean verify
                               
                               # Upload báo cáo JaCoCo HTML làm Artifact
                               - name: Upload JaCoCo Coverage Report
                                 if: always() # Đảm bảo tải lên kể cả khi build thất bại để dễ debug
                                 uses: actions/upload-artifact@v4
                                 with:
                                   name: jacoco-coverage-report
                                   path: Bai 9.2/target/site/jacoco/   # Đường dẫn tới thư mục báo cáo
                                   retention-days: 7