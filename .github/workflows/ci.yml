name: Java CI/CD Maven Workflow

# 1. Kích hoạt workflow khi có sự kiện push hoặc pull_request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ repository
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Cache dependencies để tối ưu thời gian build

      # Bước 3: Thực thi pha test (Maven build lifecycle)
      - name: Run Unit Tests
        run: mvn test

      # Bước 4: Thực thi pha package đóng gói file .jar
      - name: Package Application
        run: mvn package

      # Bước 5: Upload file .jar làm Artifact sau khi build thành công
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-utils-app-jar
          path: target/*.jar
          retention-days: 7